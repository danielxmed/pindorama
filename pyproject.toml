[project]
name = "pindorama"
version = "0.0.0"
description = "Curated open dataset of Brazilian Portuguese public-domain literary texts."
readme = "README.md"
# 3.12 floor is forced by lingua-language-detector 2.x. The 3.13 ceiling is
# forced by chandra-ocr's torchvision dep: `torchvision==0.26.0+cu128` ships
# wheels for cp310/cp311/cp312/cp314 on Linux x86_64, but no cp313 x86_64.
# uv installs a managed CPython for us on the cluster, so neither bound is a
# portability concern.
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Daniel Nobrega Medeiros", email = "dame9177@colorado.edu" },
]
keywords = ["nlp", "portuguese", "ocr", "dataset", "huggingface", "public-domain"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

# Base deps cover Stages 1-3, 4a, 5, 6, 7. The GPU OCR stack (Stage 4b/4c) is
# behind the `ocr` extra so CPU-only jobs don't pull torch/vllm.
dependencies = [
    # Stage 1 — catalog scrape. dominiopublico.gov.br is behind a Cloudflare
    # managed challenge (`cf-mitigated: challenge`); plain httpx GETs return
    # 403. Playwright headless Chromium clears the challenge naturally. The
    # Chromium binary is fetched out-of-band via `playwright install chromium`
    # (see slurm/scrape_or_download.sh).
    "playwright>=1.59,<2",
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.14,<5",
    "lxml>=6.1,<7",
    # Stage 4a — native PDF extraction; also page rasterization input for OCR.
    "pymupdf>=1.27,<2",
    # Stage 5 — MinHash/LSH dedup.
    "datasketch>=1.10,<2",
    # Stage 5 — language ID (lingua handles short PT-BR snippets better than fasttext).
    "lingua-language-detector>=2.2,<3",
    # Stage 6/7 — corpus analysis + HF dataset packaging.
    "datasets>=4.8,<5",
    "huggingface-hub>=1.13,<2",
]

[project.optional-dependencies]
# GPU OCR stack — install via `uv sync --extra ocr` only on aa100 / atesting_a100 jobs.
# Chandra OCR 2 (`datalab-to/chandra-ocr-2`) is the Stage 4b primary; see
# docs/adr/0005-chandra-as-stage-4b-primary.md for why we replaced the
# originally-planned vllm + dots.ocr stack (vllm wheels need glibc >= 2.35; the
# CURC Alpine image is RHEL 8.10 / glibc 2.28). chandra-ocr is a pure-Python
# wheel; the [hf] extra pulls torch + torchvision + transformers + accelerate.
# torch is hard-pinned to 2.11.0 so we control the wheel version explicitly;
# transformers floor of 5.6 keeps us off the buggy 5.0–5.5 line that older
# pyproject revs called out.
ocr = [
    "chandra-ocr[hf]>=0.2,<0.3",
    # torch + torchvision must be siblings with matching CUDA tags or torchvision's
    # C extensions fail to register against torch (operator torchvision::nms does
    # not exist). Both are explicit here so [tool.uv.sources] below routes them to
    # the cu128 index instead of PyPI's default cu130 build.
    "torch==2.11.0",
    "torchvision",
    "transformers>=5.6,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
    "mypy>=1.20,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pindorama"]

# torch on PyPI defaults to a CUDA 13 build (`torch==2.11.0+cu130`). CURC
# Alpine's NVIDIA driver is 570.124.06, which supports up to CUDA 12.8 — so
# the cu130 wheel falls back to CPU at runtime (`cuda.is_available()` returns
# False with a "driver too old" warning). Point torch + torchvision at the
# upstream PyTorch cu128 index instead. The pinned versions don't change.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
