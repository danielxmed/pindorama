[project]
name = "pindorama"
version = "0.0.0"
description = "Curated open dataset of Brazilian Portuguese public-domain literary texts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Daniel Nobrega Medeiros", email = "dame9177@colorado.edu" },
]
keywords = ["nlp", "portuguese", "ocr", "dataset", "huggingface", "public-domain"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

# NOTE: Versions are intentionally NOT pinned in this bootstrap commit.
# Pinning is a follow-up task — see PROGRESS.md verification question 3.
# Until pinned, only the std-lib + pytest are required to run the smoke tests.
dependencies = []

[project.optional-dependencies]
# Dependency groups deliberately empty until Daniel confirms canonical versions
# for: torch, vllm, transformers, pymupdf, datasketch, datasets, fasttext-langdetect,
# lingua-language-detector, dots.ocr commit hash, chandra commit hash.
pipeline = []
ocr = []
hf = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pindorama"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
