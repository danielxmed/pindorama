[project]
name = "pindorama"
version = "0.0.0"
description = "Curated open dataset of Brazilian Portuguese public-domain literary texts."
readme = "README.md"
# 3.12 floor is forced by lingua-language-detector 2.x. uv installs a managed
# CPython for us on the cluster, so this is not a portability concern.
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Daniel Nobrega Medeiros", email = "dame9177@colorado.edu" },
]
keywords = ["nlp", "portuguese", "ocr", "dataset", "huggingface", "public-domain"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

# Base deps cover Stages 1-3, 4a, 5, 6, 7. The GPU OCR stack (Stage 4b/4c) is
# behind the `ocr` extra so CPU-only jobs don't pull torch/vllm.
dependencies = [
    # Stage 1 — catalog scrape (HTTP + HTML).
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.14,<5",
    "lxml>=6.1,<7",
    # Stage 4a — native PDF extraction; also page rasterization input for OCR.
    "pymupdf>=1.27,<2",
    # Stage 5 — MinHash/LSH dedup.
    "datasketch>=1.10,<2",
    # Stage 5 — language ID (lingua handles short PT-BR snippets better than fasttext).
    "lingua-language-detector>=2.2,<3",
    # Stage 6/7 — corpus analysis + HF dataset packaging.
    "datasets>=4.8,<5",
    "huggingface-hub>=1.13,<2",
]

[project.optional-dependencies]
# GPU OCR stack — install via `uv sync --extra ocr` only on aa100 / atesting_a100 jobs.
# vllm 0.20.x pins torch==2.11.0 transitively; transformers excludes 5.0.*-5.5.0,
# which is why the constraint floor is 5.6.
ocr = [
    "vllm>=0.20,<0.21",
    "torch==2.11.0",
    "transformers>=5.6,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
    "mypy>=1.20,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pindorama"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
